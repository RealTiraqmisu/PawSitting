<html>
    <head>
    </head>
    <body>
        <h1>{{page_title}}</h1>
        <h3>{{current_date}}</h3>
        <!-- <h1>Lastest questions</h1> -->
        {% if question %}
            <ul>
            {% for question in question %}
                <li><a href="{% url 'detail' question.id %}">{{ question.question_text }}</a></li>
            {% endfor %}
            </ul>
        {% else %}
            <p>No polls are available.</p>
        {% endif %}
    </body>
</html>
